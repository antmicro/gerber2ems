interfaces:
  .PCIE: &pcie
    impedance:
      diff: {nominal: 85, tolerance: 0.15}
      se: {nominal: 50, tolerance: 0.15}
    skew:
      intra-pair: 1e-12
      clock-data: 1.6e-9

  PCIE_1.0:
    <<: *pcie
    frequency: 1.25e9

  PCIE_2.0:
    <<: *pcie
    frequency: 2.5e9

  PCIE_3.0:
    <<: *pcie
    frequency: 4e9

  PCIE_4.0:
    <<: *pcie
    frequency: 8e9

  .sata: &sata
    impedance:
      diff: {nominal: 100, tolerance: 0.15}
      se: {nominal: 50, tolerance: 0.15}
    skew:
      intra-pair: 1e-12
      inter-pair: 0.8e-9

  SATA_1:
    <<: *sata
    frequency: 7.5e8

  SATA_2:
    <<: *sata
    frequency: 1.5e9

  SATA_3:
    <<: *sata
    frequency: 3e9

  .ETH: &eth
    impedance:
      diff: {nominal: 100, tolerance: 0.15}
      se: {nominal: 50, tolerance: 0.15}
    skew:
      intra-pair: 1e-12
      inter-pair: 1.5e-12
      clock-data: 3.3e-10

  ETH_10Mb:
    <<: *eth
    frequency: 1e7

  ETH_100Mb:
    <<: *eth
    frequency: 3.125e7

  ETH_1000Mb:
    <<: *eth
    frequency: 6.25e7

  .USB: &usb
    impedance:
      diff: {nominal: 90, tolerance: 0.15}
      se: {nominal: 50, tolerance: 0.15}

  .USB_2.0: &usb_2_0
    <<: *usb
    skew:
      intra-pair: 7.5e-12

  USB_2.0_LS:
    <<: *usb_2_0
    frequency: 7.5e5
    rise-fall-time: 7.5e-8 # Universal Serial Bus Specification Revision 2.0 7.1.2.1 Low-speed and Full-speed Data Signal Rise and Fall

  USB_2.0_FS:
    <<: *usb_2_0
    frequency: 6e6
    rise-fall-time: 4.0e-9 # Universal Serial Bus Specification Revision 2.0 7.1.2.1 Low-speed and Full-speed Data Signal Rise and Fall

  USB_2.0_HS:
    <<: *usb_2_0
    frequency: 2.4e8
    rise-fall-time: 5.0e-10 # Universal Serial Bus Specification Revision 2.0 7.1.2.2 High-speed Signaling Eye Patterns and Rise and Fall Time

  .USB_3.0: &usb_3_0
    <<: *usb
    skew:
      intra-pair: 1e-12
      inter-pair: 1.6e-9
    impedance:
      diff: {nominal: 85, tolerance: 0.15}
      se: {nominal: 43, tolerance: 0.15}

  USB_3.2_GEN1:
    <<: *usb_3_0
    frequency: 2.5e9

  USB_3.2_GEN2:
    <<: *usb_3_0
    frequency: 5e9
  
  USB_4.0_GEN3:
    <<: *usb_3_0
    frequency: 1e10
  
  USB_4.0_GEN4:
    <<: *usb_3_0
    frequency: 2e10

  LVDS:
    impedance:
      diff: {nominal: 100, tolerance: 0.15}
      se: {nominal: 55, tolerance: 0.15}
    skew:
      intra-pair: 1e-12
      clock-data: 3.5e-12

  .HDMI: &hdmi
    impedance:
      diff: {nominal: 100, tolerance: 0.10}
      se: {nominal: 50, tolerance: 0.15}
    skew:
      intra-pair: 5e-12
      inter-pair: 1.5e-10

  HDMI_1.0-1.2a:
    <<: *hdmi
    frequency: 1.65e8

  HDMI_1.3-1.4:
    <<: *hdmi
    frequency: 3.4e8

  HDMI_2.0-2.2:
    <<: *hdmi
    frequency: 6e8

  .DP: &display_port
    impedance:
      diff: {nominal: 100, tolerance: 0.10}
      se: {nominal: 50, tolerance: 0.15}
    skew:
      intra-pair: 1e-12
      inter-pair: 1.5e-10

  DP_RBR:
    <<: *display_port
    frequency: 1.62e8

  DP_HBR:
    <<: *display_port
    frequency: 2.7e8

  DP_HBR2:
    <<: *display_port
    frequency: 5.4e8

  DP_HBR3:
    <<: *display_port
    frequency: 8.1e8

  .SDIO: &sdio
    impedance:
      se: {nominal: 50, tolerance: 0.15}

  USH_SD:
    <<: *sdio
    frequency: 2.08e8
    skew:
      clock-data: 2e-11

  MMCPLUS:
    <<: *sdio
    frequency: 5.2e7
    skew:
      clock-data: 1e-10

  .I2C: &i2c
    impedance:
      se: {nominal: 50, tolerance: 0.15}

  I2C_SM:
    <<: *i2c
    frequency: 1e5

  I2C_FM:
    <<: *i2c
    frequency: 4e5

  I2C_FMP:
    <<: *i2c
    frequency: 1e6

  I2S:
    impedance:
      se: {nominal: 50, tolerance: 0.20}
    skew:
      clock-data: 2.5e-10

  SPI:
    frequency: 6.5e7
    impedance:
      se: {nominal: 50, tolerance: 0.15}
    skew:
      clock-data: 1e-10

  DSI:
    frequency: 5e8
    impedance:
      diff: {nominal: 100, tolerance: 0.10}
      se: {nominal: 50, tolerance: 0.10}
    skew:
      intra-pair: 1e-12
      clock-data: 1e-11

  CSI-2:
    frequency: 5e8
    impedance:
      diff: {nominal: 100, tolerance: 0.10}
      se: {nominal: 50, tolerance: 0.10}
    skew:
      intra-pair: 1e-12
      clock-data: 1e-11